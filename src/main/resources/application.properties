# ==== Datasource ====
spring.datasource.url=jdbc:postgresql://localhost:5432/myfinance_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==== Flyway Mirations ====
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ==== JPA / Hibernate ====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==== Thymeleaf ====
spring.thymeleaf.cache=false

# ==== Server ====
server.port=8080


# ==== JWT ====
security.jwt.secret=${JWT_SECRET:KNst5gPq3khtBJ9UcKnDStzC5XyzNDdy68SUyNTUmrE=}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# ==== Locale/Formatação (relevante para valores monetários e datas) ====
spring.mvc.format.date=iso